name: scrape cartelera

on:
  schedule:
    - cron: '0 13 * * *'   # 07:00 America/Mexico_City
    - cron: '0 21 * * *'   # 15:00 America/Mexico_City
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install dependencies
        run: pip install -r scraper/requirements.txt

      - name: run scraper
        env:
          TZ: America/Mexico_City
        run: python scraper/scrape.py

      - name: commit schedule.json if changed
        run: |
          if git diff --quiet -- docs/data/schedule.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/schedule.json
          git commit -m "actualizar cartelera $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # A commit landing between checkout and push would otherwise fail the
          # run outright; schedule.json is generated, so rebasing onto whatever
          # arrived is always the right move.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "could not push after 3 attempts"
          exit 1

      # The scraper aborts rather than publish a partial cartelera, which means
      # a broken run is otherwise silent: the site just quietly ages until the
      # frontend's stale banner appears 36h later.
      - name: open an issue if the scrape failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'scrape falló';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const body = `La corrida del scraper falló: ${runUrl}\n\n` +
              `\`schedule.json\` no se actualizó — el sitio sigue sirviendo los últimos ` +
              `datos buenos y mostrará el banner de "datos desactualizados" a las 36 h.`;
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'scrape-failure',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['scrape-failure'],
              });
            }
